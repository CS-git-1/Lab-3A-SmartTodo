<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Todo</title>
    <style>
        * { box-sizing: border-box; }

        body {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f7fa;
            color: #1f2937;
            font-family: Arial, sans-serif;
        }

        h1 { margin-bottom: 8px; }
        .subtitle { margin-top: 0; color: #64748b; }

        form { display: flex; gap: 10px; margin: 24px 0; }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font: inherit;
        }

        button {
            padding: 9px 14px;
            border: 0;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        button:hover { background: #1d4ed8; }
        button:focus-visible, input:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }

        ul { list-style: none; padding: 0; }

        li {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            padding: 14px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: white;
        }

        li span { flex: 1; overflow-wrap: anywhere; }
        li.completed span { color: #64748b; text-decoration: line-through; }
        .toggle { background: #16a34a; }
        .toggle:hover { background: #15803d; }
        .delete { background: #dc2626; }
        .delete:hover { background: #b91c1c; }
        #empty-message { color: #64748b; text-align: center; }

        @media (max-width: 420px) {
            form { flex-direction: column; }
            form button { width: 100%; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Smart Todo</h1>
        <p class="subtitle">Keep track of the things you want to get done.</p>

        <form id="todo-form">
            <label for="todo-input" hidden>New task</label>
            <input id="todo-input" type="text" placeholder="Add a task..." maxlength="200" required>
            <button type="submit">Add task</button>
        </form>

        <ul id="todo-list" aria-label="Todo list"></ul>
        <p id="empty-message">No tasks yet. Add one above.</p>
    </main>

    <script>
        // Tasks live in this array for as long as the page remains open.
        const todos = [];
        const form = document.querySelector('#todo-form');
        const input = document.querySelector('#todo-input');
        const list = document.querySelector('#todo-list');
        const emptyMessage = document.querySelector('#empty-message');

        function renderTodos() {
            list.replaceChildren();
            emptyMessage.hidden = todos.length > 0;

            todos.forEach((todo, index) => {
                const item = document.createElement('li');
                item.classList.toggle('completed', todo.completed);

                const text = document.createElement('span');
                text.textContent = todo.text;

                const toggleButton = document.createElement('button');
                toggleButton.type = 'button';
                toggleButton.className = 'toggle';
                toggleButton.textContent = todo.completed ? 'Undo' : 'Done';
                toggleButton.setAttribute('aria-label', `${todo.completed ? 'Mark' : 'Complete'} ${todo.text}`);
                toggleButton.addEventListener('click', () => {
                    todos[index].completed = !todos[index].completed;
                    renderTodos();
                });

                const deleteButton = document.createElement('button');
                deleteButton.type = 'button';
                deleteButton.className = 'delete';
                deleteButton.textContent = 'Delete';
                deleteButton.setAttribute('aria-label', `Delete ${todo.text}`);
                deleteButton.addEventListener('click', () => {
                    todos.splice(index, 1);
                    renderTodos();
                });

                item.append(text, toggleButton, deleteButton);
                list.append(item);
            });
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            todos.push({ text, completed: false });
            form.reset();
            input.focus();
            renderTodos();
        });

        renderTodos();
    </script>
</body>
</html>
